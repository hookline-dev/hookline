name: CI
on: {push: {branches: [main]}, pull_request: {}}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: 1.26.x, cache: true}
      - run: go build ./...
      - run: go vet ./...
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: 1.26.x, cache: true}
      - run: go test -race ./...
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: hookline, POSTGRES_PASSWORD: hookline, POSTGRES_DB: hookline}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hookline" --health-interval 3s --health-timeout 3s --health-retries 20
    env: {TEST_DATABASE_URL: "postgres://hookline:hookline@localhost:5432/hookline?sslmode=disable"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: 1.26.x, cache: true}
      - run: go test -race -tags=integration ./...
      - run: ./scripts/check-coverage.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: 1.26.x}
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.12.2}
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false}
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install Gitleaks CLI
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan repository history
        run: gitleaks git --no-banner --redact --exit-code 1
