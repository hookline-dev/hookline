name: CI
on: {push: {branches: [main]}, pull_request: {}}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: 1.26.x, cache: true}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: hookline, POSTGRES_PASSWORD: hookline, POSTGRES_DB: hookline}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hookline" --health-interval 3s --health-timeout 3s --health-retries 20
    env: {TEST_DATABASE_URL: "postgres://hookline:hookline@localhost:5432/hookline?sslmode=disable"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: 1.26.x, cache: true}
      - run: go test -race -tags=integration ./...
      - run: ./scripts/check-coverage.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: 1.26.x}
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.12.2}
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false}
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --redact --no-banner
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - run: docker compose -f deploy/docker-compose.yml up -d --build --wait postgres hookline-api hookline-worker sink
      - run: curl --fail --retry 10 --retry-delay 2 http://localhost:8080/readyz
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
