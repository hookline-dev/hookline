name: hookline
x-env: &env
  DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
  DB_MAX_CONNS: "${DB_MAX_CONNS}"
  WORKER_POOL_SIZE: "${WORKER_POOL_SIZE}"
  WORKER_BATCH_SIZE: "${WORKER_BATCH_SIZE}"
  WORKER_POLL_INTERVAL: "${WORKER_POLL_INTERVAL}"
  QUEUE_LEASE_DURATION: "${QUEUE_LEASE_DURATION}"
  QUEUE_REAPER_INTERVAL: "${QUEUE_REAPER_INTERVAL}"
  DELIVERY_TIMEOUT: "${DELIVERY_TIMEOUT}"
  DELIVERY_MAX_RESPONSE_BYTES: "${DELIVERY_MAX_RESPONSE_BYTES}"
  DELIVERY_BODY_SNIPPET_BYTES: "${DELIVERY_BODY_SNIPPET_BYTES}"
  DELIVERY_USER_AGENT: "${DELIVERY_USER_AGENT}"
  RETRY_BASE_DELAY: "${RETRY_BASE_DELAY}"
  RETRY_MAX_DELAY: "${RETRY_MAX_DELAY}"
  RETRY_MAX_ATTEMPTS: "${RETRY_MAX_ATTEMPTS}"
  BREAKER_FAILURE_THRESHOLD: "${BREAKER_FAILURE_THRESHOLD}"
  BREAKER_OPEN_DURATION: "${BREAKER_OPEN_DURATION}"
  BREAKER_MAX_OPEN_DURATION: "${BREAKER_MAX_OPEN_DURATION}"
  SIGNATURE_TOLERANCE: "${SIGNATURE_TOLERANCE}"
  DEFAULT_ENDPOINT_RATE_LIMIT: "${DEFAULT_ENDPOINT_RATE_LIMIT}"
  INGEST_MAX_BODY_BYTES: "${INGEST_MAX_BODY_BYTES}"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports: ["${POSTGRES_PORT}:5432"]
    volumes: [hookline-pg-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"], interval: 3s, timeout: 3s, retries: 20}
  hookline-api:
    build: {context: ..}
    environment:
      <<: *env
      APP_MODE: api
      HTTP_PORT: 8080
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      AUTO_MIGRATE: "true"
    ports: ["${HTTP_PORT}:8080"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, -qO-, http://localhost:8080/readyz], interval: 5s, timeout: 3s, retries: 20}
  hookline-worker:
    build: {context: ..}
    entrypoint: [/usr/local/bin/hookline, --mode=worker]
    environment: {<<: *env, APP_MODE: worker}
    deploy: {replicas: 3}
    depends_on: {hookline-api: {condition: service_healthy}}
  sink:
    build: {context: ..}
    entrypoint: [/usr/local/bin/sink]
    ports: ["${SINK_PORT}:9090"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9091:9090"]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
    volumes: [./grafana/provisioning:/etc/grafana/provisioning:ro, ./grafana/dashboards:/var/lib/grafana/dashboards:ro]
    ports: ["3000:3000"]
  telegram-sink:
    profiles: [dogfood]
    build: {context: ..}
    entrypoint: [/usr/local/bin/telegram-sink]
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      HOOKLINE_ENDPOINT_SECRET: "${TELEGRAM_ENDPOINT_SECRET}"
      SIGNATURE_TOLERANCE: "${SIGNATURE_TOLERANCE}"
volumes: {hookline-pg-data: {}}
